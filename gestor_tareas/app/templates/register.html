{% extends 'base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<h2>Crear cuenta</h2>
<form method="post">
  <label for="username">Usuario</label><input name="username" id="username" required>
  <label for="email">Correo electrónico</label><input type="email" name="email" id="email" required>
  <label for="password">Contraseña (mínimo 8, letras y números)</label><input type="password" name="password" id="password" required>
  <p><button type="submit">Registrarme</button></p>
</form>
{% endblock %}
