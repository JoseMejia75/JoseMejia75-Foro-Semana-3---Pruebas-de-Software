<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestor de Tareas{% endblock %} - Plásticos Sustentables</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:1rem;color:#222}
    nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ccc;padding-bottom:.5rem;margin-bottom:1rem}
    nav .spacer{flex:1}
    .flash{background:#fff3cd;border:1px solid #e6d27a;padding:.5rem;margin:.5rem 0;border-radius:4px}
    label{display:block;margin:.6rem 0 .2rem}
    input,textarea{width:100%;padding:.4rem;box-sizing:border-box}
    button{padding:.4rem .8rem;cursor:pointer}
    .task{border:1px solid #ddd;border-radius:6px;padding:.6rem;margin:.6rem 0}
    .done h3{text-decoration:line-through;color:#777}
    form.inline{display:inline}
  </style>
</head>
<body>
  <nav>
    <strong>Gestor de Tareas</strong>
    {% if g.user %}
      <a href="{{ url_for('tasks.index') }}">Mis tareas</a>
      <a href="{{ url_for('tasks.create') }}">Nueva tarea</a>
      <span class="spacer"></span>
      <a href="{{ url_for('profile.edit_profile') }}">{{ g.user['username'] }}</a>
      <a href="{{ url_for('auth.logout') }}">Salir</a>
    {% else %}
      <span class="spacer"></span>
      <a href="{{ url_for('auth.login') }}">Iniciar sesión</a>
      <a href="{{ url_for('auth.register') }}">Registrarse</a>
    {% endif %}
  </nav>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
